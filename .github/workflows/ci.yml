name: Shine Cross-Platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtdeclarative'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libva-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-window \
            xvfb

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHINE_REQUIRE_UI=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DSHINE_REQUIRE_UI=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --output-on-failure -V

      - name: Test (Linux + Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --output-on-failure -V

      - name: Package Windows Installer (NSIS + ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
            $env:PATH += ";C:\Program Files (x86)\NSIS"
          }
          cpack --config build/CPackConfig.cmake -G NSIS -B build/packages
          cpack --config build/CPackConfig.cmake -G ZIP -B build/packages

      - name: Upload Windows Installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: shine-windows-installer
          path: |
            build/packages/*.exe
            build/packages/*.zip

      - name: Package Linux Installer (.deb)
        if: runner.os == 'Linux'
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B build/packages
          dpkg-deb --info build/packages/*.deb
          dpkg-deb --contents build/packages/*.deb

      - name: Upload Linux Installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: shine-linux-deb
          path: build/packages/*.deb
